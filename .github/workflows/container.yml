name: Validate and publish container

on:
  push:
    branches: [main, 'feature/**', 'codex/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: production
      MPD_MODE: real
      MPD_HOST: 127.0.0.1
      MPD_PORT: '9'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: server/requirements.txt
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Isolate test data and configuration
        run: |
          mkdir -p "$RUNNER_TEMP/mpd-ci/config" "$RUNNER_TEMP/mpd-ci/music"
          printf 'DATABASE_PATH=%s/mpd-ci/test.db\nCONFIG_DIR=%s/mpd-ci/config\nMUSIC_ROOT=%s/mpd-ci/music\n' \
            "$RUNNER_TEMP" "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Install declared dependencies in the CI runner
        run: |
          mkdir -p "$CONFIG_DIR" "$MUSIC_ROOT"
          # Keep lint aligned with the validated local tool, within requirements.
          printf 'ruff==0.16.9\n' > "$RUNNER_TEMP/ci-lint-constraints.txt"
          python -m pip install -r server/requirements.txt -c "$RUNNER_TEMP/ci-lint-constraints.txt"
          npm --prefix web ci
      - name: Backend regression and lint
        run: |
          python -m pytest -q server/tests
          python -m ruff check server/app server/tests
      - name: Web regression, types and production build
        run: |
          npm --prefix web run test -- --run --maxWorkers=1 --minWorkers=1
          npm --prefix web run typecheck
          npm --prefix web run build

  image:
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Resolve immutable source tag
        id: source
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish both architectures
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.source.outputs.image }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Record deployment reference
        env:
          IMAGE: ${{ steps.source.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker buildx imagetools inspect "$IMAGE:sha-$GITHUB_SHA"
          printf 'Image: `%s:sha-%s`\n\nDigest: `%s`\n\nPlatforms: linux/amd64, linux/arm64\n' \
            "$IMAGE" "$GITHUB_SHA" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
