services:
  server:
    image: python:3.13-slim
    working_dir: /workspace
    command: >-
      sh -c "pip install --no-cache-dir -r server/requirements.txt &&
      uvicorn server.app.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      APP_ENV: development
      MPD_MODE: mock
      DATABASE_PATH: /data/music-server-dev.db
    volumes:
      - ..:/workspace
      - mpd_server_dev_data:/data
    ports:
      - "8000:8000"

  web:
    image: node:22-alpine
    working_dir: /workspace/web
    command: >-
      sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    volumes:
      - ../web:/workspace/web
      - mpd_server_dev_node_modules:/workspace/web/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - server

volumes:
  mpd_server_dev_data:
  mpd_server_dev_node_modules:
