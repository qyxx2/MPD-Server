services:
  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: ${MPD_SERVER_IMAGE:-mpd-server:latest}
    restart: unless-stopped
    environment:
      APP_ENV: production
      MPD_MODE: real
      MPD_HOST: ${MPD_HOST:-172.17.0.1}
      MPD_PORT: ${MPD_PORT:-6600}
      MPD_PASSWORD: ${MPD_PASSWORD:-}
      MUSIC_ROOT: /music
      DATABASE_PATH: /data/music-server.db
      BACKUP_DIR: /backups
      CONFIG_DIR: /config
      MPD_CONNECTION_PATH: /data/mpd-connection.json
      MPD_URI_PREFIX: ${MPD_URI_PREFIX:-}
      MPD_CAPABILITIES_PATH:
      SCAN_INTERVAL_SECONDS: ${SCAN_INTERVAL_SECONDS:-43200}
      DEBOUNCE_SECONDS: ${DEBOUNCE_SECONDS:-0.5}
      OUTPUT_NAME:
      OUTPUT_PLUGIN: ${OUTPUT_PLUGIN:-alsa}
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: "8000"
      WORKERS: "1"
    volumes:
      - ${MPD_SERVER_DATA_DIR:-./data}:/data
      - ${MPD_SERVER_BACKUP_DIR:-./backups}:/backups
      - ${MPD_SERVER_CONFIG_DIR:-./config}:/config
      - ${MUSIC_DIR:-/volume1/music}:/music:ro
    ports:
      - "${MPD_SERVER_PORT:-8000}:8000"
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
